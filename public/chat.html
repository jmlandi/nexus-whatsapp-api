<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Chat - IA WN7 Marketing</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #root {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            max-height: 700px;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header-avatar {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .chat-header-info h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .chat-header-info p {
            font-size: 14px;
            opacity: 0.9;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f7fb;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.agent .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: #e0e7ff;
            color: #667eea;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.agent .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 5px;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-container input:focus {
            border-color: #667eea;
        }

        .input-container button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-container button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .input-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .welcome-screen {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .welcome-logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .welcome-screen h1 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .welcome-screen p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .welcome-form {
            width: 100%;
            max-width: 400px;
        }

        .welcome-form input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .welcome-form input:focus {
            border-color: #667eea;
        }

        .welcome-form button {
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .welcome-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 10px;
            margin: 10px;
            text-align: center;
        }

        @media (max-width: 768px) {
            #root {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
            }

            .chat-container {
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE_URL = window.location.origin + '/api/webchat';

        function ChatApp() {
            const [sessionId, setSessionId] = useState(null);
            const [name, setName] = useState('');
            const [messages, setMessages] = useState([]);
            const [inputMessage, setInputMessage] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isTyping, setIsTyping] = useState(false);
            const [error, setError] = useState('');
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages, isTyping]);

            const startSession = async (e) => {
                e.preventDefault();
                if (!name.trim()) return;

                setIsLoading(true);
                setError('');

                try {
                    const response = await fetch(`${API_BASE_URL}/session`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name.trim() })
                    });

                    if (!response.ok) throw new Error('Erro ao criar sessão');

                    const data = await response.json();
                    setSessionId(data.sessionId);
                    setMessages([{
                        id: Date.now(),
                        type: 'agent',
                        message: data.welcomeMessage,
                        timestamp: new Date().toISOString()
                    }]);
                } catch (err) {
                    setError('Erro ao conectar. Tente novamente.');
                    console.error(err);
                } finally {
                    setIsLoading(false);
                }
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!inputMessage.trim() || isTyping) return;

                const userMessage = inputMessage.trim();
                setInputMessage('');

                // Adiciona mensagem do usuário
                const newUserMessage = {
                    id: Date.now(),
                    type: 'user',
                    message: userMessage,
                    timestamp: new Date().toISOString()
                };
                setMessages(prev => [...prev, newUserMessage]);
                setIsTyping(true);

                try {
                    const response = await fetch(`${API_BASE_URL}/message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sessionId,
                            message: userMessage
                        })
                    });

                    if (!response.ok) throw new Error('Erro ao enviar mensagem');

                    const data = await response.json();

                    // Adiciona resposta da IA
                    setMessages(prev => [...prev, {
                        id: Date.now() + 1,
                        type: 'agent',
                        message: data.reply,
                        timestamp: data.timestamp
                    }]);
                } catch (err) {
                    setError('Erro ao enviar mensagem. Tente novamente.');
                    console.error(err);
                } finally {
                    setIsTyping(false);
                }
            };

            const formatTime = (timestamp) => {
                return new Date(timestamp).toLocaleTimeString('pt-BR', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            if (!sessionId) {
                return (
                    <div className="chat-container">
                        <div className="welcome-screen">
                            <div className="welcome-logo">🤖</div>
                            <h1>Nexus Chat</h1>
                            <p>Assistente de IA da WN7 Marketing Digital</p>
                            <form className="welcome-form" onSubmit={startSession}>
                                <input
                                    type="text"
                                    placeholder="Digite seu nome"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    disabled={isLoading}
                                    autoFocus
                                />
                                <button type="submit" disabled={isLoading || !name.trim()}>
                                    {isLoading ? 'Conectando...' : 'Iniciar Conversa'}
                                </button>
                            </form>
                            {error && <div className="error-message">{error}</div>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="chat-container">
                    <div className="chat-header">
                        <div className="chat-header-avatar">🤖</div>
                        <div className="chat-header-info">
                            <h1>Nexus</h1>
                            <p>Assistente de IA • Online</p>
                        </div>
                    </div>

                    <div className="messages-container">
                        {messages.map((msg) => (
                            <div key={msg.id} className={`message ${msg.type}`}>
                                <div className="message-avatar">
                                    {msg.type === 'agent' ? '🤖' : '👤'}
                                </div>
                                <div>
                                    <div className="message-content">
                                        {msg.message}
                                    </div>
                                    <div className="message-time">
                                        {formatTime(msg.timestamp)}
                                    </div>
                                </div>
                            </div>
                        ))}
                        
                        {isTyping && (
                            <div className="message agent">
                                <div className="message-avatar">🤖</div>
                                <div className="message-content">
                                    <div className="typing-indicator">
                                        <div className="typing-dot"></div>
                                        <div className="typing-dot"></div>
                                        <div className="typing-dot"></div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        <div ref={messagesEndRef} />
                    </div>

                    {error && <div className="error-message">{error}</div>}

                    <form className="input-container" onSubmit={sendMessage}>
                        <input
                            type="text"
                            placeholder="Digite sua mensagem..."
                            value={inputMessage}
                            onChange={(e) => setInputMessage(e.target.value)}
                            disabled={isTyping}
                            autoFocus
                        />
                        <button type="submit" disabled={isTyping || !inputMessage.trim()}>
                            Enviar
                        </button>
                    </form>
                </div>
            );
        }

        ReactDOM.render(<ChatApp />, document.getElementById('root'));
    </script>
</body>
</html>
