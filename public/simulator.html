<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Simulador de Chat</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/simulator.css">
</head>
<body>
  <div class="simulator-container">
    <!-- Sidebar -->
    <aside class="simulator-sidebar">
      <div class="simulator-sidebar-header">
        <div class="simulator-sidebar-title">Nexus</div>
        <div class="simulator-sidebar-subtitle">Simulador de Chat</div>
      </div>
      
      <div class="simulator-sidebar-body">
        <!-- Navegação -->
        <nav class="sidebar-nav mb-4">
          <a href="/dashboard.html" class="nav-link">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span>Dashboard</span>
          </a>
          <a href="/customers.html" class="nav-link">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <span>Clientes</span>
          </a>
          <a href="/documents.html" class="nav-link">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span>Documentos</span>
          </a>
          <a href="/simulator.html" class="nav-link active">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
            <span>Simulador</span>
          </a>
        </nav>

        <!-- Seletor de Cliente -->
        <div class="customer-select-group">
          <label class="customer-select-label">Selecione um cliente</label>
          <select id="customerSelect" class="customer-select">
            <option value="">Escolha um cliente...</option>
          </select>
        </div>

        <!-- Info do Cliente -->
        <div id="customerInfo" class="card" style="display: none;">
          <div class="card-body">
            <div class="text-small text-muted mb-2">Cliente selecionado</div>
            <div class="mb-2">
              <strong id="customerName">-</strong>
            </div>
            <div class="text-xs text-muted mb-3" id="customerPhone">-</div>
            <div class="flex gap-2">
              <span class="badge badge-primary" id="documentsCount">0 docs</span>
              <span class="badge badge-success" id="chatsCount">0 chats</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="simulator-sidebar-footer">
        <button id="startChatBtn" class="btn btn-primary w-full" style="display: none;">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
          <span>Iniciar Chat</span>
        </button>
        <button id="endSimulationBtn" class="btn btn-danger w-full" style="display: none;">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
          <span>Encerrar Chat</span>
        </button>
        <button id="logoutBtn" class="btn btn-secondary w-full">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span>Sair</span>
        </button>
      </div>
    </aside>
    
    <!-- Chat Area -->
    <main class="simulator-chat">
      <div class="simulator-chat-header">
        <div class="simulator-chat-header-content">
          <div>
            <h1 class="simulator-chat-title" id="chatTitle">Selecione um cliente</h1>
            <div class="simulator-chat-status" id="chatStatus" style="display: none;">
              <span class="status-indicator"></span>
              <span>Online</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="simulator-chat-messages" id="chatMessages">
        <div class="simulator-chat-empty">
          <div class="simulator-chat-empty-icon">
            <svg width="80" height="80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
          </div>
          <h2 class="simulator-chat-empty-title">Nenhuma conversa ativa</h2>
          <p class="simulator-chat-empty-text">Selecione um cliente e inicie o chat para começar</p>
        </div>
      </div>
      
      <div class="simulator-chat-input" id="chatInputArea" style="display: none;">
        <div class="chat-input-container">
          <div class="chat-input-wrapper">
            <textarea 
              id="messageInput" 
              class="chat-input" 
              placeholder="Digite sua mensagem..."
              rows="1"
            ></textarea>
          </div>
          <button id="sendMessageBtn" class="chat-send-btn">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
            <span>Enviar</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/simulator.js"></script>
</body>
</html>
