<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Registro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>🔷 Nexus</h1>
        <p>Criar nova conta</p>
      </div>
      
      <form id="registerForm" class="login-form">
        <div class="form-group">
          <label for="name">Nome completo</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            required 
            placeholder="Seu nome"
            autocomplete="name"
          >
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="seu@email.com"
            autocomplete="email"
          >
        </div>
        
        <div class="form-group">
          <label for="password">Senha</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="Mínimo 6 caracteres"
            minlength="6"
            autocomplete="new-password"
          >
        </div>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="successMessage" class="success-message" style="display: none;"></div>
        
        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
          Criar conta
        </button>
      </form>
      
      <div class="login-footer">
        <p>Já tem uma conta? <a href="/login.html">Fazer login</a></p>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const registerBtn = document.getElementById('registerBtn');
      
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
      registerBtn.disabled = true;
      registerBtn.textContent = 'Criando conta...';
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || 'Erro ao criar conta');
        }
        
        // Salva o token
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // Mostra mensagem de sucesso e redireciona
        successMessage.textContent = 'Conta criada com sucesso! Redirecionando...';
        successMessage.style.display = 'block';
        
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1500);
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.style.display = 'block';
        registerBtn.disabled = false;
        registerBtn.textContent = 'Criar conta';
      }
    });
  </script>
</body>
</html>
