# Render Blueprint Configuration
# This file defines the infrastructure for deploying Nexus on Render
# Learn more: https://render.com/docs/blueprint-spec

services:
  # PostgreSQL Database
  - type: pserv
    name: nexus-postgres
    plan: starter # Free tier available
    region: ohio # Choose: oregon, ohio, frankfurt, singapore
    ipAllowList: [] # Allow all IPs (Render services)

  # Node.js Web Service (API + Frontend)
  - type: web
    name: nexus-api
    runtime: node
    plan: starter # Free tier available
    region: ohio # Same region as database for lower latency
    buildCommand: "./build.sh"
    startCommand: "npm start"
    healthCheckPath: /health
    envVars:
      # Node Configuration
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 10000 # Render's internal port
      
      # Database (automatically set by Render from the database service)
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres
          property: connectionString
      
      # WhatsApp Business API (Meta) - SET THESE IN RENDER DASHBOARD
      - key: WHATSAPP_API_VERSION
        value: v21.0
      
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false # Secret - set manually in Render dashboard
      
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false # Secret - set manually in Render dashboard
      
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false # Secret - set manually in Render dashboard
      
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        generateValue: true # Auto-generate secure token
      
      # AWS S3 Configuration - SET THESE IN RENDER DASHBOARD
      - key: AWS_REGION
        value: us-east-1
      
      - key: AWS_ACCESS_KEY_ID
        sync: false # Secret - set manually in Render dashboard
      
      - key: AWS_SECRET_ACCESS_KEY
        sync: false # Secret - set manually in Render dashboard
      
      - key: AWS_S3_BUCKET_NAME
        sync: false # Set manually in Render dashboard
      
      # Anthropic AI Configuration - SET THIS IN RENDER DASHBOARD
      - key: ANTHROPIC_API_KEY
        sync: false # Secret - set manually in Render dashboard
      
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      
      - key: ANTHROPIC_MAX_TOKENS
        value: 1024
      
      # JWT Configuration
      - key: JWT_SECRET
        generateValue: true # Auto-generate secure secret
      
      - key: JWT_EXPIRES_IN
        value: 24h
      
      # Application Configuration
      - key: CHAT_TIMEOUT_MINUTES
        value: 15
      
      - key: MAX_PAGE_SIZE
        value: 100
      
      - key: DEFAULT_PAGE_SIZE
        value: 20
    
    # Auto-deploy from main branch
    autoDeploy: true
    
    # Disk for logs (persistent storage)
    disk:
      name: nexus-logs
      mountPath: /app/logs
      sizeGB: 1
